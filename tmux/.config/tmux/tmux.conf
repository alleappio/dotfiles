# keybindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g default-terminal "tmux-256color"
set -g terminal-overrides ",$TERM:Tc"
set -g extended-keys on
# set -g extended-keys-format csi-u

set -g prefix C-b

set -g mouse on
set -g base-index 1
set -g set-clipboard on
set -g renumber-windows on

set-option -g status-position top
set -g allow-passthrough on

set-window-option -g mode-keys vi

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

unbind f
bind f display-popup -E -w 80% -h 80% "~/.config/tmux/start_session.sh"

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :10

bind -n M-l select-pane -L
bind -n M-h select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n C-O split-window -c "#{pane_current_path}"
bind -n C-E split-window -h -c "#{pane_current_path}"
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

source-file ~/.config/tmux/tmux-theme.conf
