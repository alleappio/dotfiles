include theme.conf

term xterm-256color
disable_ligatures always
scrollback_lines 5000
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

confirm_os_window_close 0

cursor_shape beam
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.1 0.4

modify_font cell_height +1px

tab_bar_edge top
tab_bar_style custom
tab_separator none
tab_bar_min_tabs 1
tab_title_template "{index}:{title}"
tab_title_max_length 10
tab_bar_filter session:~ or session:^$

allow_remote_control socket-only
listen_on unix:/tmp/mykitty

enabled_layouts splits,stack

startup_session ~/.config/kitty/sessions/home.kitty-session

map ctrl+backspace send_text all \x1b\x7f

map ctrl+shift+k scroll_line_up smooth
map ctrl+shift+j scroll_line_down smooth
map ctrl+shift+p show_scrollback

map ctrl+shift+o launch --location=hsplit --cwd=current
map ctrl+shift+e launch --location=vsplit --cwd=current
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+shift+z toggle_layout stack
# map ctrl+shift+f goto_session --sort-by=alphabetical ~/.config/kitty/sessions/
map ctrl+shift+f launch --type=overlay ~/.config/kitty/session_picker.sh
map ctrl+shift+s save_as_session --use-foreground-process --base-dir=~/.config/kitty/sessions/ --save-only

map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10
