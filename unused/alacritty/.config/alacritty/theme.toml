# Colors (Gruvbox Material Medium Dark)

# Default colors
[colors.primary]
background = '#272e33'
foreground = '#d3c6aa'

# Normal colors
[colors.normal]
black = '#414b50'
red = '#e67e80'
green = '#a7c080'
yellow = '#dbbc7f'
blue = '#7fbbb3'
magenta = '#d699b6'
cyan = '#83c092'
white = '#d3c6aa'

# Bright colors (same as normal colors)
[colors.bright]
black = '#414b50'
red = '#e67e80'
green = '#a7c080'
yellow = '#dbbc7f'
